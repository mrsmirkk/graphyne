[package]
name = "graphyne"
description = "Graphyne IDE binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "graphyne"
path = "src/main.rs"

[dependencies]
graphyne-ui.workspace = true

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
resvg = "0.45"

[features]
# Diagnostics: count live Rust heap bytes (see src/main.rs).
alloc-stats = []
