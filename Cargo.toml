[workspace]
resolver = "2"
members = [
    "crates/graphyne",
    "crates/graphyne-core",
    "crates/graphyne-syntax",
    "crates/graphyne-terminal",
    "crates/graphyne-git",
    "crates/graphyne-lsp",
    "crates/graphyne-dap",
    "crates/graphyne-ui",
    "crates/graphyne-lua",
    "crates/graphyne-db",
]
default-members = ["crates/graphyne"]

[workspace.package]
version = "0.1.0-alpha.11"
edition = "2024"
license = "MIT"
authors = ["mr.smirk"]

[workspace.dependencies]
graphyne-core = { path = "crates/graphyne-core" }
graphyne-syntax = { path = "crates/graphyne-syntax" }
graphyne-terminal = { path = "crates/graphyne-terminal" }
graphyne-git = { path = "crates/graphyne-git" }
graphyne-lsp = { path = "crates/graphyne-lsp" }
graphyne-dap = { path = "crates/graphyne-dap" }
graphyne-ui = { path = "crates/graphyne-ui" }
graphyne-lua = { path = "crates/graphyne-lua" }
graphyne-db = { path = "crates/graphyne-db" }

gpui = "0.2.2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
flume = "0.12"
smallvec = "1"
ropey = "1.6"
unicode-segmentation = "1"
nucleo = "0.5"
lsp-types = "0.97"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
trash = "5"
# SQLite compiled in: Database panel works without installing anything.
rusqlite = { version = "0.43", features = ["bundled"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql = { version = "28", features = ["native-tls"] }
keyring = "4"
memmap2 = "0.9"
dirs = "6"
sha2 = "0.10"
regex = "1"
ignore = "0.4"
notify = "8"

tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.25"
tree-sitter-dart = "0.3"
tree-sitter-lua = "0.5"
tree-sitter-ruby = "0.23"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-sequel = "0.3"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.25"

portable-pty = "0.9"
alacritty_terminal = "0.26"

git2 = { version = "0.20", default-features = false }
imara-diff = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Local gpui 0.2.2 with startup fixes (see third_party/gpui/GRAPHYNE-CHANGES.md).
[patch.crates-io]
gpui = { path = "third_party/gpui" }
